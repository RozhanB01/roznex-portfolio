name: ROZNEX Cinematic Hero Browser QA

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Production Smoke Test"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: roznex-cinema-browser-qa
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Check mobile and desktop video playback, sound activation and scroll continuation
        run: node scripts/hero-browser-audit.mjs
