name: ROZNEX Cinematic Hero Browser QA

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Production Smoke Test"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: roznex-cinema-browser-qa
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.56.1
      - name: Verify full Google Chrome with H.264 and AAC support
        run: google-chrome --version
      - name: Check video delivery headers including browser range requests
        shell: bash
        run: |
          set -euo pipefail
          for file in roznex-cinematic-hero-enhanced.mp4 roznex-cinematic-hero-enhanced-mobile.mp4; do
            echo "Checking $file"
            curl --retry 2 --retry-delay 3 --max-time 45 --fail -sSL -D /tmp/media-headers -H 'Range: bytes=0-1023' "https://roznexstudio.ir/assets/$file" -o /tmp/media-head.bin
            sed -n '1,22p' /tmp/media-headers
            echo "Received: $(wc -c < /tmp/media-head.bin) bytes"
          done
      - name: Check mobile and desktop video playback, sound activation and scroll continuation
        run: node scripts/hero-browser-audit.mjs
