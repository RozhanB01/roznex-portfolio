name: Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roznex-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for production deployment
        run: sleep 55

      - name: Check ROZNEX production
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://roznex-portfolio.vercel.app"

          retry_status() {
            local url="$1"
            local out="$2"
            local expected="$3"
            local follow="${4:-yes}"
            for i in {1..15}; do
              if [ "$follow" = "yes" ]; then
                code=$(curl -L -sS -o "$out" -w "%{http_code}" --max-time 20 "$url" || true)
              else
                code=$(curl -sS -o "$out" -w "%{http_code}" --max-time 20 "$url" || true)
              fi
              echo "$url -> $code (expected $expected)"
              if [ "$code" = "$expected" ]; then return 0; fi
              sleep 8
            done
            echo "Failed: $url"
            cat "$out" || true
            return 1
          }

          retry_status "$BASE/" home.html 200
          retry_status "$BASE/start/" start.html 200
          retry_status "$BASE/work/" work.html 200
          retry_status "$BASE/work/en/industrial-intelligence/" work-case.html 200
          retry_status "$BASE/services/" services.html 200
          retry_status "$BASE/services/fa/ai-agents/" service-fa.html 200
          retry_status "$BASE/services/en/technical-seo/" service-en.html 200
          retry_status "$BASE/about/en/rozhan-behrouzi/" author.html 200
          retry_status "$BASE/insights/en/ai-agent-security/" article-extra.html 200
          retry_status "$BASE/insights/" insights.html 200
          retry_status "$BASE/insights/fa/ai-agent-business/" insight-fa.html 200
          retry_status "$BASE/insights/en/technical-seo-nextjs/" insight-en.html 200
          retry_status "$BASE/sitemap.xml" sitemap.xml 200
          retry_status "$BASE/admin" admin.html 200
          retry_status "$BASE/quote/" quote.html 401 no
          retry_status "$BASE/.well-known/security.txt" security.txt 200
          retry_status "$BASE/api/projects?fresh=$(date +%s)" projects.json 200
          retry_status "$BASE/api/storage-health?ts=$(date +%s)" storage.json 200

          python - <<'PY'
          import json, re, urllib.request

          home=open('home.html',encoding='utf-8').read()
          if 'ROZNEX' not in home:
              raise SystemExit('Homepage does not contain ROZNEX')
          if not re.search(r'script\.js\?v=[^"\']+', home):
              raise SystemExit('Homepage does not reference a versioned script asset')

          work=open('work.html',encoding='utf-8').read()
          work_case=open('work-case.html',encoding='utf-8').read()
          if 'ROZNEX / CASE STUDIES' not in work:
              raise SystemExit('Case study hub did not render')
          if '"@type":"CreativeWork"' not in work_case or 'rel="canonical"' not in work_case:
              raise SystemExit('Case study SEO metadata is incomplete')

          services=open('services.html',encoding='utf-8').read()
          if 'ROZNEX / SERVICES' not in services or '/services/en/ai-agents/' not in services:
              raise SystemExit('Services hub did not render expected content')

          service_fa=open('service-fa.html',encoding='utf-8').read()
          service_en=open('service-en.html',encoding='utf-8').read()
          for name,html in [('service-fa',service_fa),('service-en',service_en)]:
              if '"@type":"Service"' not in html or 'hreflang=' not in html or 'rel="canonical"' not in html:
                  raise SystemExit(name+' SEO metadata is incomplete')

          author=open('author.html',encoding='utf-8').read()
          article_extra=open('article-extra.html',encoding='utf-8').read()
          if '"@type":"Person"' not in author or 'rel="canonical"' not in author:
              raise SystemExit('Author page SEO metadata is incomplete')
          if '"@type":"BlogPosting"' not in article_extra or '/services/en/ai-agents/' not in article_extra:
              raise SystemExit('Extended topic-cluster article is incomplete')

          insights=open('insights.html',encoding='utf-8').read()
          if 'ROZNEX / INSIGHTS' not in insights or '/insights/fa/ai-agent-business/' not in insights:
              raise SystemExit('Insights hub did not render expected content')

          insight_fa=open('insight-fa.html',encoding='utf-8').read()
          if 'BlogPosting' not in insight_fa or 'hreflang=' not in insight_fa or 'rel="canonical"' not in insight_fa:
              raise SystemExit('Persian Insight SEO metadata is incomplete')

          insight_en=open('insight-en.html',encoding='utf-8').read()
          if 'BlogPosting' not in insight_en or 'hreflang=' not in insight_en or 'rel="canonical"' not in insight_en:
              raise SystemExit('English Insight SEO metadata is incomplete')

          sitemap_text=open('sitemap.xml',encoding='utf-8').read()
          if '/insights/fa/ai-agent-business/' not in sitemap_text or '/insights/en/technical-seo-nextjs/' not in sitemap_text:
              raise SystemExit('Sitemap is missing Insights URLs')

          start=open('start.html',encoding='utf-8').read()
          if 'id="projectForm"' not in start or '/api/requests' not in start:
              raise SystemExit('Project intake form is not wired to the requests API')

          admin=open('admin.html',encoding='utf-8').read()
          if 'ورود به مدیریت' not in admin:
              raise SystemExit('Admin login page did not render')

          quote=open('quote.html',encoding='utf-8').read()
          if 'پیش‌فاکتور خصوصی است' not in quote:
              raise SystemExit('Locked SmartQuote page did not render')

          security=open('security.txt',encoding='utf-8').read()
          if 'Contact:' not in security or 'Expires:' not in security:
              raise SystemExit('security.txt is incomplete')

          projects=json.load(open('projects.json',encoding='utf-8'))
          if not isinstance(projects.get('projects'), list):
              raise SystemExit('Public projects API shape is invalid')

          storage=json.load(open('storage.json',encoding='utf-8'))
          print('storage:', json.dumps(storage, ensure_ascii=False))
          if storage.get('configured') is not True:
              raise SystemExit('Blob storage is not configured in production')
          if 'detectedTokenKey' in storage or 'detectedStoreKey' in storage:
              raise SystemExit('Public storage health leaks environment key names')

          public=projects.get('projects') or []
          print('public projects:', len(public))
          if public:
              image=public[0].get('imageUrl')
              if image:
                  url='https://roznex-portfolio.vercel.app'+image if image.startswith('/') else image
                  req=urllib.request.Request(url,headers={'User-Agent':'ROZNEX-Smoke-Test'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      if r.status != 200:
                          raise SystemExit(f'Project image returned {r.status}')
                      ctype=r.headers.get('content-type','')
                      if not ctype.startswith('image/'):
                          raise SystemExit(f'Project image content-type invalid: {ctype}')
                  print('project image: ok')
          PY
