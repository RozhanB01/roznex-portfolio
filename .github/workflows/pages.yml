name: Redirect ROZNEX GitHub Pages to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect-only site
        shell: bash
        run: |
          mkdir -p public
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta http-equiv="refresh" content="0;url=https://roznex-portfolio.vercel.app/">
            <link rel="canonical" href="https://roznex-portfolio.vercel.app/">
            <title>ROZNEX</title>
          </head>
          <body>
            <p><a href="https://roznex-portfolio.vercel.app/">Open ROZNEX</a></p>
          </body>
          </html>
          HTML
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
