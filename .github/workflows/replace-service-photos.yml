name: ROZNEX Replace Unwanted Service Photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-service-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roznex-service-photo-replace
  cancel-in-progress: true

jobs:
  render-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<12'
      - name: Fetch high-resolution editorial photography and optimize
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen,Request
          from PIL import Image,ImageOps,ImageEnhance
          from io import BytesIO
          
          sources={
           'service-industrial-luxe.webp':'https://images.unsplash.com/photo-1496247749665-49cf5b1022e9?auto=format&fit=crop&w=1800&q=90',
           'service-web-luxe.webp':'https://images.unsplash.com/photo-1714757917579-eed0974e6711?auto=format&fit=crop&w=1800&q=90',
          }
          for filename,url in sources.items():
            request=Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'image/avif,image/webp,image/*'})
            with urlopen(request,timeout=32) as response:
              assert response.headers.get('Content-Type','').startswith('image/'), 'not an image'
              payload=response.read(8_000_000)
            with Image.open(BytesIO(payload)) as raw:
              image=ImageOps.exif_transpose(raw).convert('RGB')
              assert image.width>=1150 and image.height>=650, f'Image too small: {filename}: {image.size}'
              image.thumbnail((1440,960),Image.Resampling.LANCZOS)
              image=ImageEnhance.Color(image).enhance(.91)
              image=ImageEnhance.Contrast(image).enhance(1.045)
              destination=Path('assets')/filename
              image.save(destination,'WEBP',quality=83,method=6)
              bytesize=destination.stat().st_size
              assert bytesize<350000,f'Image too heavy {filename} {bytesize}'
              assert bytesize>35000,f'Image potentially over-compressed {filename} {bytesize}'
              print(f'{destination}: {image.size}, {bytesize:,} bytes')
          PY
      - name: Publish the optimized images in project repository
        shell: bash
        run: |
          set -euo pipefail
          git add assets/service-industrial-luxe.webp assets/service-web-luxe.webp
          if git diff --staged --quiet; then
            echo "Images are unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'design: replace unwanted service photos with premium editorial photography'
          git push origin HEAD:main
