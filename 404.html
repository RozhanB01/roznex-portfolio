<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#eee7dd">
  <title>صفحه پیدا نشد — ROZNEX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:1.5rem;background:#eee7dd;color:#11141b;font-family:Vazirmatn,Manrope,sans-serif}.shell{width:min(66rem,100%);min-height:34rem;display:grid;grid-template-columns:1fr 1fr;align-items:center;border:1px solid rgba(17,20,27,.16);border-radius:2rem;overflow:hidden;background:#f5f0e9}.copy{padding:clamp(2rem,6vw,5rem)}.logo{font:700 1rem Manrope;letter-spacing:.2em}.code{font:500 clamp(8rem,22vw,18rem)/.8 Manrope;color:transparent;-webkit-text-stroke:1px rgba(167,122,69,.6);text-align:center;letter-spacing:-.1em}.eyebrow{font:600 .65rem Manrope;letter-spacing:.16em;color:#9a7448;margin-top:5rem}.copy h1{font-size:clamp(2rem,5vw,4rem);line-height:1.1;margin:.8rem 0}.copy p{color:#6b655e;line-height:1.9;max-width:28rem}.copy a{display:inline-flex;margin-top:1rem;padding:.85rem 1.3rem;border-radius:999px;background:#11141b;color:white;text-decoration:none;font-size:.78rem}@media(max-width:700px){.shell{grid-template-columns:1fr}.code{grid-row:1;padding-top:3rem}.copy{padding-top:1rem}.eyebrow{margin-top:1rem}}</style>
</head>
<body><main class="shell"><section class="copy"><div class="logo">ROZNEX</div><div class="eyebrow">404 / NOT FOUND</div><h1>این صفحه پیدا نشد.</h1><p>ممکن است آدرس تغییر کرده باشد یا این صفحه هنوز منتشر نشده باشد.</p><a href="/">بازگشت به صفحه اصلی ←</a></section><div class="code" aria-hidden="true">404</div></main></body>
</html>
